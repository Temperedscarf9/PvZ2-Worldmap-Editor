<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worldmap Studio · PvZ2</title>
</head>
<body class="studio">

<div id="app-shell" aria-hidden="false">

  <!-- ═══════════════ Top bar ═══════════════ -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="brand-copy">
        <strong>WORLDMAP</strong>
        <span>STUDIO</span>
      </div>
    </div>

    <div class="topbar-divider"></div>

    <div class="world-switch">
      <label for="selected-world-select">世界</label>
      <select id="selected-world-select" class="select" disabled>
        <option value="">-- 先上传资源包 --</option>
      </select>
    </div>

    <div class="res-switch">
      <label for="texture-res-select">RES</label>
      <select id="texture-res-select" class="select res-select" title="纹理分辨率（仅 1536 / 768）">
        <option value="1536">1536</option>
        <option value="768">768</option>
      </select>
    </div>

    <div class="topbar-spacer"></div>

    <div class="topbar-actions">
      <button class="icon-btn" id="btn-undo" title="撤销 (Ctrl+Z)" disabled aria-label="撤销">↶</button>
      <button class="icon-btn" id="btn-redo" title="重做 (Ctrl+Y)" disabled aria-label="重做">↷</button>
      <div class="topbar-divider"></div>
      <button class="icon-btn" id="btn-toggle-left" title="显示/隐藏属性面板" aria-label="属性面板">◧</button>
      <button class="icon-btn" id="btn-toggle-right" title="显示/隐藏素材面板" aria-label="素材面板">◨</button>
      <div class="topbar-divider"></div>
      <button class="btn btn-danger" id="btn-unload-pack" title="卸载当前资源包并返回首页">卸载数据包</button>
      <button class="btn btn-primary" id="btn-save" title="保存并下载 worldmap.json">保存地图</button>
      <button class="icon-btn danger" id="btn-restart" title="重置为原始地图">⟲</button>
    </div>
  </header>

  <!-- ═══════════════ Workspace ═══════════════ -->
  <div class="workspace">

    <!-- ── Left: inspector ── -->
    <aside class="drawer drawer-left" id="sidebar-right" aria-label="属性面板">
      <div class="drawer-head">
        <div class="drawer-title">属性</div>
        <button class="drawer-collapse" id="btn-collapse-left" title="折叠">‹</button>
      </div>

      <div class="drawer-body">
        <section class="drawer-page active" data-left-page="inspect">

          <!-- ① 身份摘要：只读，且只放“编辑区里没有的东西”
               类型 / 名称 / imageID / 资源路径。
               坐标、旋转、缩放、层级一律不在这里重复渲染。 -->
          <div class="section-title">
            <span>选中对象</span>
            <span class="section-hint" id="selection-kind">—</span>
          </div>

          <!-- ② 唯一的数值编辑区：变换参数 -->
          <div class="section-title spaced">
            <span>变换</span>
          </div>
          <div id="transform-panel" class="transform-panel">
            <div class="empty-inline">未选中对象</div>
          </div>

          <!-- ③ 事件专有属性，同样只保留可编辑字段 -->
          <div id="event-properties" class="event-properties"></div>

          <!-- ④ 地图边界 -->
          <div class="section-title spaced">
            <span>地图边界</span>
            <label class="bounds-toggle"><input type="checkbox" id="show-bounds-checkbox" checked /> 显示</label>
          </div>
          <div id="bounds-panel" class="transform-grid">
            <div class="field"><label>X</label><input class="input" type="number" step="1" data-bounds-field="x" /></div>
            <div class="field"><label>Y</label><input class="input" type="number" step="1" data-bounds-field="y" /></div>
            <div class="field"><label>Width</label><input class="input" type="number" step="1" data-bounds-field="width" /></div>
            <div class="field"><label>Height</label><input class="input" type="number" step="1" data-bounds-field="height" /></div>
          </div>
        </section>
      </div>
    </aside>

    <!-- ── Center: viewport ── -->
    <main id="viewport" aria-label="地图视口">
      <div id="empty-state-border"></div>
      <div id="map-container"></div>
      <canvas id="bbox-layer"></canvas>
      <div id="selection-frame" class="selection-frame" aria-hidden="true"></div>
      <div id="bounds-overlay" class="bounds-overlay" aria-hidden="true"></div>

      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-out" title="缩小">−</button>
        <span id="zoom-disp" class="zoom-value">100%</span>
        <button class="zoom-btn" id="zoom-in" title="放大">＋</button>
      </div>

      <div class="viewport-hud hud-bottom">
        <span id="footer-coord" class="coord-readout">X 0&nbsp;&nbsp;Y 0</span>
      </div>

      <div id="toast" class="editor-toast" style="display: none;"></div>
    </main>

    <!-- ── Right: asset palette ── -->
    <aside class="drawer drawer-right" id="right-drawer" aria-label="素材面板">
      <div class="drawer-head">
        <div class="drawer-tabs" role="tablist">
          <button class="drawer-tab active" data-right-tab="assets" role="tab">素材</button>
          <button class="drawer-tab" data-right-tab="events" role="tab">事件</button>
        </div>
        <button class="drawer-collapse" id="btn-collapse-right" title="折叠">›</button>
      </div>

      <div class="drawer-body">
        <section class="drawer-page active" data-right-page="assets">
          <div class="section-title">
            <span>地图碎片</span>
            <span class="section-hint" id="asset-count">0</span>
          </div>
          <div class="palette-toolbar">
            <input id="asset-search" class="search" type="search" placeholder="搜索 imageID / 名称…" />
          </div>
          <div id="asset-palette" class="asset-palette">
            <div class="empty-inline">加载世界后显示素材</div>
          </div>
          <div class="palette-foot">
            <span>当前默认 imageID</span>
            <strong id="active-image-id">—</strong>
          </div>
        </section>

        <section class="drawer-page" data-right-page="events">
          <div class="section-title">
            <span>事件类型</span>
            <span class="section-hint">Event palette</span>
          </div>
          <div id="event-palette" class="event-palette"></div>
          <div class="palette-foot">
            <span>当前放置类型</span>
            <strong id="active-event-type">level</strong>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <!-- ═══════════════ Bottom dock ═══════════════ -->
  <footer class="dock" id="controls-bar">
    <div class="dock-group mode-group" id="toolbar-modes">
      <button class="mode-btn" id="btn-mode-island" title="岛屿模式 (I)"><b>I</b><span>岛屿</span></button>
      <button class="mode-btn" id="btn-mode-doodad" title="装饰物模式 (D)"><b>D</b><span>装饰</span></button>
      <button class="mode-btn" id="btn-mode-event" title="事件模式 (E)"><b>E</b><span>事件</span></button>
      <button class="mode-btn active" id="btn-mode-select" title="选择模式 (S)"><b>S</b><span>选择</span></button>
    </div>

    <div class="dock-divider"></div>

    <div class="dock-group" id="island-subtools">
      <button class="tool-btn" id="btn-island-add" title="添加岛屿">＋ 添加</button>
      <button class="tool-btn" id="btn-island-move" title="移动岛屿">✥ 移动</button>
      <button class="tool-btn" id="btn-island-rotation" title="旋转岛屿">↻ 旋转</button>
      <button class="tool-btn" id="btn-island-flip" title="水平翻转">⇋ 翻转</button>
      <button class="tool-btn danger" id="btn-island-delete" title="删除岛屿">✕ 删除</button>
      <div class="dock-sep"></div>
      <button class="tool-btn mini" id="btn-img-prev" title="上一张图片">‹</button>
      <button class="tool-btn mini" id="btn-img-next" title="下一张图片">›</button>
      <button class="tool-btn" id="btn-cur-layer" title="仅显示/编辑当前图层">图层</button>
      <button class="tool-btn mini" id="btn-layer-dec" title="降低绘制层">−</button>
      <button class="tool-btn mini" id="btn-layer-inc" title="提高绘制层">＋</button>
    </div>

    <div class="dock-group" id="event-subtools" style="display:none;">
      <button class="tool-btn" id="btn-event-type" title="切换放置的事件类型">类型：level</button>
      <button class="tool-btn" id="btn-event-add" title="添加事件">＋ 添加</button>
      <button class="tool-btn" id="btn-event-edit" title="编辑选中事件属性">✎ 属性</button>
      <button class="tool-btn" id="btn-event-move" title="移动事件">✥ 移动</button>
      <button class="tool-btn danger" id="btn-event-delete" title="删除事件">✕ 删除</button>
    </div>

    <div class="dock-group" id="middle-select" style="display:flex;">
      <button class="tool-btn" id="btn-append" title="从选中节点追加 path_node">＋ 追加路径</button>
      <button class="tool-btn danger" id="btn-select-delete" title="删除选中节点">✕ 删除选中</button>
    </div>

    <div class="dock-divider"></div>

    <div class="dock-group dock-view-group">
      <button class="tool-btn" id="btn-pan" title="平移模式 (P)">✥ 平移</button>
      <button class="tool-btn" id="btn-map-only" title="仅显示地图碎片，隐藏事件/路径">▣ 仅地图</button>
      <button class="tool-btn" id="snap-grid-checkbox" aria-pressed="false" title="移动时吸附网格">⌗ 吸附</button>
      <div class="dock-sep"></div>
      <button class="tool-btn" id="btn-recenter" title="复位视图">⟲ 复位</button>
      <button class="tool-btn" id="btn-fit-map" title="适配全图">⤢ 全图</button>
      <button class="tool-btn danger" id="btn-clear" title="清空当前地图">✕ 清空</button>
    </div>

    <div class="dock-spacer"></div>

    <div class="dock-group dock-right">
      <span id="history-hint" class="dock-hint">尚无编辑历史</span>
    </div>
  </footer>
</div>

<!-- ═══════════════ Hidden compatibility controls ═══════════════ -->
<div id="toolbar-middle-controls" style="display:none;"></div>
<div id="toolbar-right-controls" style="display:none;"></div>

<!-- rotate popover -->
<div id="rotate-panel" class="rotate-panel" style="display:none;" aria-hidden="true">
  <div class="rotate-title">旋转角度</div>
  <div class="rotate-row">
    <button type="button" class="rotate-btn" data-delta="-5">−5°</button>
    <button type="button" class="rotate-btn" data-delta="-1">−1°</button>
    <button type="button" class="rotate-btn" data-delta="1">+1°</button>
    <button type="button" class="rotate-btn" data-delta="5">+5°</button>
  </div>
  <button type="button" class="btn btn-primary rotate-ok" id="rotate-panel-ok">完成</button>
</div>

<!-- hidden file inputs -->
<input type="file" id="folder-upload-input" webkitdirectory directory multiple style="display:none;" />

<!-- ═══════════════ Intro / upload modal ═══════════════ -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal intro-modal">
    <div class="intro-brand">
      <div class="brand-mark large" aria-hidden="true"><span></span><span></span><span></span></div>
      <div>
        <h1>Worldmap Studio</h1>
        <p>PvZ2 世界地图编辑器 · 重构版</p>
      </div>
    </div>

    <div class="intro-grid">
      <div class="drop-zone" id="drop-images">
        <div class="drop-icon">⇪</div>
        <strong>拖入资源文件夹</strong>
        <span id="img-folder-name">或点击选择包含 images / worldmap 的根目录</span>
        <em>支持完整 convert 资源包</em>
      </div>
      <div class="intro-options">
        <label class="switch-row">
          <span>中国版本</span>
          <input type="checkbox" id="check-china-version" />
          <i class="switch"></i>
        </label>
        <label class="switch-row">
          <span>线性地图</span>
          <input type="checkbox" id="check-is-linear" checked />
          <i class="switch"></i>
        </label>
        <div class="intro-note">
          <span>上传内容只在本地浏览器解析，不会发送到服务器。</span>
        </div>
      </div>
    </div>

    <div class="intro-actions">
      <span id="upload-progress" class="muted"></span>
      <button class="btn btn-primary btn-lg" id="start-viewer" disabled>启动编辑器</button>
    </div>
  </div>
</div>

<!-- confirm modal -->
<div id="confirm-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal confirm-modal">
    <div class="modal-head">
      <span class="modal-icon">!</span>
      <h2>确认操作</h2>
    </div>
    <p id="confirm-modal-message" class="confirm-message"></p>
    <div class="modal-actions">
      <button id="confirm-modal-cancel" class="btn btn-ghost">取消</button>
      <button id="confirm-modal-ok" class="btn btn-danger">确认</button>
    </div>
  </div>
</div>

<!-- loading -->
<div id="global-loading-overlay" class="loading-overlay" style="display:none;" aria-hidden="true">
  <div class="loading-card">
    <div class="spinner"></div>
    <div id="global-loading-text" class="loading-text">处理中…</div>
    <div id="global-loading-sub" class="loading-sub"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
